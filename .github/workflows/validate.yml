name: Validate county trends pipeline
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Spark
        run: python -m pip install -r requirements-ci.txt
      - name: Check Python syntax
        run: python -m compileall -q notebooks tests dashboard analysis sources
      - name: Verify source manifest
        run: python sources/verify_manifest.py
      - name: Check research statistics against source snapshots
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Execute source checks and Spark notebook
        run: python tests/run_pipeline.py
